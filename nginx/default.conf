log_format json_access escape=json '{"timestamp":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/portfolio-access.log json_access;
    error_log /var/log/nginx/portfolio-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
server {
    listen 8081;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
